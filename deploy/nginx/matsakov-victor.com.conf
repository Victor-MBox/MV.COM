# nginx для matsakov-victor.com — статическая сборка Vite (dist/) из /var/www/matsakov-victor.com/current
# плюс прокси /api/ на обработчик формы (server/contact.js, служба systemd mvcom-contact на 127.0.0.1:3721).
# Ставится скриптом deploy/server-setup.sh в /etc/nginx/sites-available/. HTTPS добавляет certbot
# (`certbot --nginx -d matsakov-victor.com -d www.matsakov-victor.com --redirect`): он сам дописывает блоки 443 и редиректы с 80.

# www → без www
server {
    listen 80;
    listen [::]:80;
    server_name www.matsakov-victor.com;
    return 301 $scheme://matsakov-victor.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name matsakov-victor.com;

    root /var/www/matsakov-victor.com/current;
    index index.html;

    access_log /var/log/nginx/matsakov-victor.com.access.log;
    error_log  /var/log/nginx/matsakov-victor.com.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # add_header уровня server не наследуется в location со своими add_header — там продублировано
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # index.html и файлы без хеша в имени (favicon, логотипы) — браузер перепроверяет каждый раз (ETag → 304)
    add_header Cache-Control "no-cache" always;

    # Ассеты Vite с хешем в имени — кэш на год
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Обработчик формы: POST /api/contact и GET /api/contact/health → Node-служба mvcom-contact. Снаружи она доступна
    # только отсюда; X-Real-IP нужен ей для лимита заявок с одного адреса. Ответы не кэшируются
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3721;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Маршруты приложения (src/app/App.tsx): index.html со статусом 200, дальше роутинг на клиенте.
    # Новый раздел верхнего уровня → добавить сюда.
    location = / {
        try_files /index.html =404;
    }
    location ~ ^/(services|portfolio|about|blog|contacts|privacy|personal-data-consent|cookies)(/|$) {
        try_files /index.html =404;
    }

    # Всё остальное: файл из dist/ или 404. Тело ответа 404 — тот же index.html (приложение покажет NotFoundPage),
    # статус при этом остаётся 404 — это и есть «HTTP-статус 404 — забота хостинга» из code.md §3.
    error_page 404 /index.html;
    location / {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
